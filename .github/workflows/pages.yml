name: Publish companion Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: missing-data-pages
  cancel-in-progress: false
jobs:
  pages:
    if: github.repository == 'nicholaskarlson/missing-data' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Require the authorized public repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/nicholaskarlson/missing-data --jq .private)" = false
      - run: python scripts/build_site.py --outdir build/pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages
      - id: deployment
        uses: actions/deploy-pages@v4
