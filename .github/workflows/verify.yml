name: Verify missing-data companion
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: missing-data-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  companion-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify the ordinary export boundary and checksums
        run: python scripts/verify_companion.py --boundary-only
      - name: Build and validate the public site
        run: python scripts/build_site.py --outdir build/site-check
      - name: Record the scope of this hosted check
        run: |
          echo 'MISSING_CI_SCOPE_OK boundary=true site=true numerical_executed=false'
          echo 'The release procedure requires separate local verification of all sixteen cases through NumPy, plain Python and base R.' >> "$GITHUB_STEP_SUMMARY"
